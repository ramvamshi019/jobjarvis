<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>JobJarvis Save</title>
  <style>
    body {
      width: 320px;
      font: 14px -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      margin: 0;
      padding: 16px;
      color: #111;
    }
    h1 {
      margin: 0 0 4px 0;
      font-size: 16px;
      color: #1d4ed8;
    }
    p.subtitle {
      margin: 0 0 16px 0;
      font-size: 12px;
      color: #666;
    }
    .url {
      background: #f3f4f6;
      padding: 8px;
      border-radius: 6px;
      font-family: ui-monospace, monospace;
      font-size: 11px;
      word-break: break-all;
      max-height: 60px;
      overflow: auto;
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      color: #666;
      font-weight: 600;
      text-transform: uppercase;
      margin-top: 12px;
      margin-bottom: 4px;
    }
    input[type=text] {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #1d4ed8;
      color: #fff;
      border: 0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
    }
    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }
    .result {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
    }
    .result.ok       { background: #d1fae5; color: #065f46; }
    .result.error    { background: #fee2e2; color: #991b1b; }
    .result.unsupported { background: #fef3c7; color: #92400e; }
    .settings {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>
  <h1>JobJarvis</h1>
  <p class="subtitle">Save this job to your AI-matched index.</p>

  <div id="url" class="url">loading…</div>

  <button id="save-btn">↗ Save to JobJarvis</button>

  <div id="result" class="result" style="display:none"></div>

  <div class="settings">
    <label>JobJarvis backend URL</label>
    <input id="backend" type="text" placeholder="http://localhost:8000">
    <label>API token (from localStorage jj_token on JobJarvis)</label>
    <input id="token" type="text" placeholder="paste your JWT here">
  </div>

  <script src="popup.js"></script>
</body>
</html>
