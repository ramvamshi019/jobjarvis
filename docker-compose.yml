# ─────────────────────────────────────────────────────────────────────────────
#  JobJarvis – Docker Compose (development & single-host production)
# ─────────────────────────────────────────────────────────────────────────────

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://jobjarvis:jobjarvis@postgres:5432/jobjarvis
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  SECRET_KEY: ${SECRET_KEY:-changeme_in_production_use_openssl_rand_hex_32}
  ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AI_DAILY_BUDGET_USD: ${AI_DAILY_BUDGET_USD:-5.0}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
  # Embedding backend — sentence-transformers (free, local, 384 dims)
  EMBEDDING_BACKEND: sentence_transformers
  ST_MODEL: all-MiniLM-L6-v2
  VECTOR_DIMENSIONS: "384"
  ML_MODEL_PATH: /app/data/models
  # HF / sentence-transformers cache → writable dir (HOME is read-only)
  HF_HOME: /tmp/hf_cache
  SENTENCE_TRANSFORMERS_HOME: /tmp/st_cache
  XDG_CACHE_HOME: /tmp/xdg_cache
  # Playwright browsers → writable dir
  PLAYWRIGHT_BROWSERS_PATH: /tmp/pw_browsers

services:

  # ── PostgreSQL + pgvector ───────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jobjarvis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobjarvis
      POSTGRES_PASSWORD: jobjarvis
      POSTGRES_DB: jobjarvis
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobjarvis -d jobjarvis"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: jobjarvis_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: jobjarvis_backend
    restart: unless-stopped
    environment:
      <<: *backend-env
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
      - ./backend/scripts:/app/scripts:ro      # ← scripts persist across rebuilds
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Celery Worker ───────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: jobjarvis_celery_worker
    restart: unless-stopped
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info --concurrency=12 --max-tasks-per-child=200
      -Q default,scans,ai,reports
      --without-gossip --without-mingle
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      <<: *backend-env
      CELERY_WORKER: "1"
      PYTHONUNBUFFERED: "1"                   # ← stdout flush per line (no log buffering)
    env_file:
      - .env
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
      - ./backend/scripts:/app/scripts:ro      # ← scripts persist across rebuilds
      - backend_data:/app/data
      - playwright_browsers:/tmp/pw_browsers    # ← chromium persists across restarts
      - playwright_artifacts:/tmp/auto_apply    # ← screenshots persist
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$(hostname) --timeout 5 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Celery Beat (scheduler) ─────────────────────────────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: jobjarvis_celery_beat
    restart: unless-stopped
    # Store the celerybeat-schedule file inside /app/data — that volume is
    # already owned by the appuser (created by the backend container's
    # Dockerfile chown).  Avoids the EACCES that hits a fresh root-owned
    # named volume after `docker compose down -v`.
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule=/app/data/celerybeat-schedule
    environment:
      <<: *backend-env
      CELERY_WORKER: "1"
      PYTHONUNBUFFERED: "1"                   # ← stdout flush per line (no log buffering)
    env_file:
      - .env
    volumes:
      - ./backend/logs:/app/logs
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        BACKEND_URL: http://backend:8000
    container_name: jobjarvis_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      BACKEND_URL: http://backend:8000
      # Force Next.js standalone server to bind on all interfaces.
      # Default is the container's bridge IP, which makes the localhost
      # healthcheck (and any internal wget probe) fail.
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --tries=1 --timeout=3 http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Airflow (pipeline orchestration) – optional ────────────────────────────
  airflow:
    image: apache/airflow:2.9.1
    container_name: jobjarvis_airflow
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://jobjarvis:jobjarvis@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-jobjarvis}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock  # so DAGs can exec into worker
    ports:
      - "8080:8080"
    command: >
      bash -c "airflow db migrate &&
               airflow users create --username admin --firstname Admin
               --lastname User --role Admin --email admin@jobjarvis.ai
               --password $${_AIRFLOW_WWW_USER_PASSWORD:-jobjarvis} &&
               airflow webserver"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - airflow

  # ── Airflow scheduler (runs separately from webserver) ─────────────────────
  airflow_scheduler:
    image: apache/airflow:2.9.1
    container_name: jobjarvis_airflow_scheduler
    restart: unless-stopped
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://jobjarvis:jobjarvis@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - /var/run/docker.sock:/var/run/docker.sock
    command: airflow scheduler
    depends_on:
      - airflow
    profiles:
      - airflow

  # ── Flower (Celery monitoring) – optional ───────────────────────────────────
  flower:
    image: mher/flower:2.0
    container_name: jobjarvis_flower
    restart: unless-stopped
    command: celery flower --broker=redis://redis:6379/1 --port=5555
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
    ports:
      - "5555:5555"
    depends_on:
      - redis
    profiles:
      - monitoring

volumes:
  postgres_data:
  redis_data:
  backend_data:
  playwright_browsers:
  playwright_artifacts:

networks:
  default:
    name: jobjarvis_net
